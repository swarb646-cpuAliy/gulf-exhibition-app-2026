<script>
(function () {
  const base = location.pathname.startsWith('/exhibition')
    ? '/exhibition' : '';

  const originalFetch = window.fetch.bind(window);
  window.fetch = function (input, options) {
    if (typeof input === 'string' &&
        input.startsWith('/') &&
        !input.startsWith('//')) {
      input = base + input;
    }
    return originalFetch(input, options);
  };

  const originalRegister =
    navigator.serviceWorker &&
    navigator.serviceWorker.register
      ? navigator.serviceWorker.register.bind(navigator.serviceWorker)
      : null;

  if (originalRegister) {
    navigator.serviceWorker.register = function (url, options) {
      if (typeof url === 'string' && url.startsWith('/')) {
        url = base + url;
      }
      return originalRegister(url, options);
    };
  }

  function fixUrl(value) {
    if (typeof value === 'string' &&
        value.startsWith('/') &&
        !value.startsWith('//')) {
      return base + value;
    }
    return value;
  }

  function fixElements(root) {
    if (root.nodeType !== 1) return;
    const attrs = ['src', 'href'];
    for (const attr of attrs) {
      if (root.hasAttribute(attr)) {
        const value = root.getAttribute(attr);
        if (value && value.startsWith('/') &&
            !value.startsWith('//')) {
          root.setAttribute(attr, fixUrl(value));
        }
      }
    }
    root.querySelectorAll('[src^="/"],[href^="/"]').forEach(el => {
      for (const attr of attrs) {
        const value = el.getAttribute(attr);
        if (value && value.startsWith('/') &&
            !value.startsWith('//')) {
          el.setAttribute(attr, fixUrl(value));
        }
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    fixElements(document.documentElement);
    new MutationObserver(records => {
      for (const record of records) {
        record.addedNodes.forEach(node => {
          if (node.nodeType === 1) fixElements(node);
        });
      }
    }).observe(document.documentElement, {
      childList: true, subtree: true
    });
  });
})();
</script>

<script>
let appData = {
    settings:{},
    categories:[],
    listings:[]
};

let activeCategory = 'all';

async function loadData(){
    try{
        const res = await fetch('/api/data');
        appData = await res.json();

        document.title =
            appData.settings.name || 'المعرض التفاعلي';

        document.getElementById('siteName').textContent =
            appData.settings.name || 'المعرض التفاعلي';

        document.getElementById('siteDescription').textContent =
            appData.settings.description || '';

        renderCategories();
        renderListings();
        renderFloatingSocialButtons();

        const announcementBar =
            document.getElementById('announcementBar');

        const announcementText =
            document.getElementById('announcementText');

        const announcement =
            String(appData.settings.announcement || '').trim();

        if(announcement){
            announcementText.textContent = announcement;
            announcementBar.style.display = 'block';
        }else{
            announcementBar.style.display = 'none';
        }

    }catch(err){
        console.error(err);
    }
}

function renderCategories(){

    const box = document.getElementById('categories');

    box.innerHTML = '';

    const all = document.createElement('button');

    all.className =
        'category ' +
        (activeCategory === 'all' ? 'active' : '');

    all.innerHTML = `
        <div class="category-icon">✨</div>
        <div class="category-name">الكل</div>
    `;

    all.onclick = () => {
        activeCategory = 'all';
        renderCategories();
        renderListings();
    };

    box.appendChild(all);

    appData.categories.forEach(category => {

        const btn = document.createElement('button');

        btn.className =
            'category ' +
            (activeCategory === category.id ? 'active' : '');

        btn.innerHTML = `
            <div class="category-icon">
                ${escapeHtml(category.icon)}
            </div>

            <div class="category-name">
                ${escapeHtml(category.name)}
            </div>
        `;

        btn.onclick = () => {
            activeCategory = category.id;
            renderCategories();
            renderListings();
        };

        box.appendChild(btn);
    });
}

function renderListings(){

    const box = document.getElementById('listings');

    const search =
        document.getElementById('searchInput')
            .value
            .trim()
            .toLowerCase();

    let listings = appData.listings.filter(
        listing => listing.published !== false
    );

    if(activeCategory !== 'all'){
        listings = listings.filter(
            x => String(x.categoryId) === String(activeCategory)
        );
    }

    if(search){
        listings = listings.filter(x => {

            const category =
                getCategory(x.categoryId)?.name || '';

            return (
                x.title +
                ' ' +
                x.description +
                ' ' +
                x.location +
                ' ' +
                category
            ).toLowerCase().includes(search);
        });
    }

    document.getElementById('countText').textContent =
        `${listings.length} إعلان`;

    if(!listings.length){

        box.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div class="empty-icon">🔎</div>
                <h3>لا توجد نتائج</h3>
                <p>جرّب البحث بكلمة أخرى أو اختر قسماً مختلفاً.</p>
            </div>
        `;

        return;
    }

    box.innerHTML = listings.map(listing => {

        const category =
            getCategory(listing.categoryId);

        const image =
            listing.images?.[0];

        return `
            <article class="card">

                <div class="card-image">

                    ${
                        image
                        ? `<img src="${image}" alt="" loading="lazy" decoding="async">`
                        : `<div class="no-image">📦</div>`
                    }

                    ${
                        category
                        ? `
                        <div class="card-badge">
                            ${escapeHtml(category.icon)}
                            ${escapeHtml(category.name)}
                        </div>
                        `
                        : ''
                    }

                    ${
                        listing.video
                        ? `<div class="video-badge">▶ فيديو</div>`
                        : ''
                    }

                </div>

                <div class="card-body">

                    <div class="card-title">
                        ${escapeHtml(listing.title)}
                    </div>

                    ${
                        listing.location
                        ? `
                        <div class="card-location">
                            📍 ${escapeHtml(listing.location)}
                        </div>
                        `
                        : ''
                    }

                    ${
                        listing.price
                        ? `
                        <div class="card-price">
                            ${escapeHtml(listing.price)}
                        </div>
                        `
                        : ''
                    }

                    <div style="display:flex;gap:8px;align-items:center">
                        <button
                            class="view-btn"
                            style="flex:1"
                            onclick="openListing('${listing.id}')"
                        >
                            عرض التفاصيل ←
                        </button>

                        ${
                            listing.whatsapp
                            ? `<a
                                href="https://wa.me/${String(listing.whatsapp).replace(/\D/g,'')}"
                                target="_blank"
                                rel="noopener noreferrer"
                                onclick="event.stopPropagation()"
                                aria-label="واتساب صاحب الإعلان"
                                title="واتساب صاحب الإعلان"
                                style="display:flex;align-items:center;justify-content:center;background:#25D366;color:white;border-radius:10px;padding:0 14px;text-decoration:none;font-size:22px"
                            ><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.52 3.48A11.82 11.82 0 0 0 12.04 0C5.42 0 .04 5.38.04 12c0 2.12.56 4.11 1.53 5.83L0 24l6.34-1.52A11.94 11.94 0 0 0 12.04 24C18.66 24 24 18.62 24 12c0-3.2-1.25-6.22-3.48-8.52ZM12.04 21.9a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.76.9.95-3.66-.24-.38A9.88 9.88 0 1 1 12.04 21.9Zm5.43-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.68-2.08-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.48-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.48.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg></a>`
                            : ''
                        }
                    </div>

                </div>

            </article>
        `;

    }).join('');
}

function openListing(id){

    const listing =
        appData.listings.find(x => x.id === id);

    if(!listing) return;

    document.getElementById('modalTitle').textContent =
        listing.title;

    const category =
        getCategory(listing.categoryId);

    document.getElementById('modalMeta').textContent =
        [
            category
                ? `${category.icon} ${category.name}`
                : '',
            listing.location
                ? `📍 ${listing.location}`
                : ''
        ]
        .filter(Boolean)
        .join('  •  ');

    document.getElementById('modalPrice').textContent =
        listing.price || '';

    document.getElementById('modalDescription').textContent =
        listing.description || 'لا توجد تفاصيل إضافية.';

    renderGallery(listing);

    renderContacts(listing);

    document.getElementById('modal').classList.add('show');

    document.body.style.overflow = 'hidden';
}

function renderGallery(listing){

    const main =
        document.getElementById('galleryMain');

    const thumbs =
        document.getElementById('thumbs');

    window.currentGalleryImages = listing.images || [];

    const media = [
        ...(listing.images || []).map(url => ({
            type:'image',
            url
        })),
        ...(listing.video
            ? [{
                type:'video',
                url:listing.video
            }]
            : [])
    ];

    if(!media.length){

        main.innerHTML = `
            <div class="no-image">
                📦
            </div>
        `;

        thumbs.innerHTML = '';

        return;
    }

    function showMedia(index){

        const item = media[index];

        if(item.type === 'video'){

            main.innerHTML = `
                <div style="
                    width:100%;
                    height:100%;
                    min-height:300px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#000;
                    border-radius:10px;
                    overflow:hidden;
                ">
                    <video
                        src="${item.url}"
                        controls
                        playsinline
                        preload="metadata"
                        style="
                            width:100%;
                            height:100%;
                            max-width:100%;
                            max-height:100%;
                            object-fit:contain;
                            display:block;
                            background:#000;
                        "
                    ></video>
                </div>
            `;

        }else{

            main.innerHTML = `
                <img
                    src="${item.url}"
                    alt=""
                    onclick="openGalleryLightbox(${index})"
                >
            `;
        }

        [...thumbs.children].forEach(
            (el,i) => el.classList.toggle(
                'active',
                i === index
            )
        );
    }

    thumbs.innerHTML = media.map(
        (item,index) => {

            if(item.type === 'video'){
                return `
                    <div
                        class="thumb"
                        style="
                            display:grid;
                            place-items:center;
                            background:#111827;
                            color:white;
                            font-size:22px;
                        "
                        onclick="window.galleryShow(${index})"
                    >
                        ▶
                    </div>
                `;
            }

            return `
                <img
                    class="thumb"
                    src="${item.url}"
                    onclick="window.galleryShow(${index})"
                    alt=""
                >
            `;
        }
    ).join('');

    window.galleryShow = showMedia;

    showMedia(0);
}


let galleryLightboxIndex = 0;
let galleryLightboxImages = [];

function openGalleryLightbox(index){

    galleryLightboxImages =
        window.currentGalleryImages || [];

    if(!galleryLightboxImages.length) return;

    galleryLightboxIndex = index;

    updateGalleryLightbox();

    document
        .getElementById('galleryLightbox')
        .classList.add('show');

    document.body.style.overflow = 'hidden';
}

function updateGalleryLightbox(){

    const img =
        document.getElementById('galleryLightboxImage');

    const url =
        galleryLightboxImages[galleryLightboxIndex];

    if(url){
        img.src = url;
    }
}

function closeGalleryLightbox(){

    document
        .getElementById('galleryLightbox')
        .classList.remove('show');

    document.body.style.overflow = '';
}

function galleryLightboxNext(){

    if(!galleryLightboxImages.length) return;

    galleryLightboxIndex =
        (galleryLightboxIndex + 1) %
        galleryLightboxImages.length;

    updateGalleryLightbox();
}

function galleryLightboxPrev(){

    if(!galleryLightboxImages.length) return;

    galleryLightboxIndex =
        (galleryLightboxIndex - 1 +
        galleryLightboxImages.length) %
        galleryLightboxImages.length;

    updateGalleryLightbox();
}

function downloadGalleryImage(){

    const url =
        galleryLightboxImages[galleryLightboxIndex];

    if(!url) return;

    const a = document.createElement('a');

    a.href = url;
    a.download = 'صورة-الإعلان.jpg';

    document.body.appendChild(a);
    a.click();
    a.remove();
}


function renderFloatingSocialButtons(){

    const box =
        document.getElementById('floatingSocialButtons');

    if(!box) return;

    const settings =
        appData.settings || {};

    const buttons = [];

    if(settings.whatsapp){

        const number =
            String(settings.whatsapp).replace(/\D/g,'');

        if(number){
            buttons.push(`
                <a
                    class="floating-social-btn floating-whatsapp"
                    href="https://wa.me/${number}"
                    target="_blank"
                    rel="noopener"
                    aria-label="واتساب"
                    title="واتساب"
                ><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
    <circle cx="16" cy="16" r="15" fill="white"/>
    <path fill="#25D366" d="M16 6.2A9.8 9.8 0 0 0 7.7 21.1L6.5 25.5l4.5-1.2A9.8 9.8 0 1 0 16 6.2Zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.7.7.7-2.6-.2-.3A8 8 0 1 1 16 24Zm4.4-5.9c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1-.2.2-.6.7-.7.8-.1.2-.3.2-.5.1-1.4-.7-2.3-1.3-3.2-2.8-.2-.3.2-.3.6-1.1.1-.2.1-.3 0-.5l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.4c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5-.1 1.3-.5 1.5-1 .2-.5.2-.9.1-1-.1-.1-.3-.2-.5-.3Z"/>
</svg></a>
            `);
        }
    }

    if(settings.x){

        let xUrl =
            String(settings.x).trim();

        if(xUrl){

            if(!/^https?:\/\//i.test(xUrl)){
                xUrl = 'https://' + xUrl;
            }

            buttons.push(`
                <a
                    class="floating-social-btn floating-x"
                    href="${escapeAttr(xUrl)}"
                    target="_blank"
                    rel="noopener"
                    aria-label="حساب X"
                    title="X"
                >𝕏</a>
            `);
        }
    }

    box.innerHTML = buttons.join('');
}

function renderContacts(listing){

    const box =
        document.getElementById('contactButtons');

    const settings =
        appData.settings || {};

    const buttons = [];

    const whatsappNumber =
        listing?.whatsapp || settings.whatsapp || '';

    if(whatsappNumber){

        const number =
            String(whatsappNumber).replace(/\D/g,'');

        if(number){

            const text =
                encodeURIComponent(
                    'السلام عليكم، أود الاستفسار عن أحد المعروضات في المعرض.'
                );

            buttons.push(`
                <a
                    class="contact-btn"
                    href="https://wa.me/${number}?text=${text}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 واتساب
                </a>
            `);
        }
    }

    if(settings.phone){

        buttons.push(`
            <a
                class="contact-btn"
                href="tel:${escapeAttr(settings.phone)}"
            >
                📞 اتصال
            </a>
        `);
    }

    if(settings.email){

        buttons.push(`
            <a
                class="contact-btn"
                href="mailto:${escapeAttr(settings.email)}"
            >
                ✉️ البريد
            </a>
        `);
    }

    if(settings.website){

        let website =
            settings.website.trim();

        if(!/^https?:\/\//i.test(website)){
            website = 'https://' + website;
        }

        buttons.push(`
            <a
                class="contact-btn"
                href="${escapeAttr(website)}"
                target="_blank"
                rel="noopener"
            >
                🌐 الموقع
            </a>
        `);
    }

    box.innerHTML =
        buttons.length
        ? buttons.join('')
        : `
            <span style="color:#64748b;font-size:13px">
                لم يتم إضافة وسائل التواصل بعد.
            </span>
        `;

    renderFloatingSocialButtons();
}

function closeModal(){

    document.getElementById('modal')
        .classList.remove('show');

    document.body.style.overflow = '';
}

function closeOutside(event){

    if(event.target.id === 'modal'){
        closeModal();
    }
}

function getCategory(id){
    return appData.categories.find(
        x => x.id === id
    );
}

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function escapeAttr(value){
    return escapeHtml(value);
}

document.getElementById('searchInput')
    .addEventListener('input', renderListings);

const searchButton =
    document.querySelector('.search-box button');

if(searchButton){
    searchButton.addEventListener('click', function(e){
        e.preventDefault();
        renderListings();

        const listings =
            document.getElementById('listings');

        if(listings){
            listings.scrollIntoView({
                behavior:'smooth',
                block:'start'
            });
        }
    });
}

loadData();
</script>

    <div style="display:flex;gap:6px;align-items:center;">
        <button id="install-app-btn">تثبيت</button>
        <button id="install-app-close">×</button>
    </div>
</div>

<script>
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;

    const banner = document.getElementById('install-app-banner');
    if (banner) banner.style.display = 'flex';
});

document.getElementById('install-app-btn')?.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;

    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;

    deferredInstallPrompt = null;

    const banner = document.getElementById('install-app-banner');
    if (banner) banner.style.display = 'none';
});

document.getElementById('install-app-close')?.addEventListener('click', () => {
    const banner = document.getElementById('install-app-banner');
    if (banner) banner.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
    const banner = document.getElementById('install-app-banner');
    if (banner) banner.style.display = 'none';
});
</script>
