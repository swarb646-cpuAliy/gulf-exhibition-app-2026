<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>المعرض التفاعلي</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#f5f7fb;
    color:#172033;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hero{
    min-height:470px;
    padding:35px 6% 70px;
    position:relative;
    overflow:hidden;
    color:white;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.16),transparent 25%),
        radial-gradient(circle at 85% 80%,rgba(255,255,255,.12),transparent 28%),
        linear-gradient(135deg,#111827,#1e3a8a 55%,#0f766e);
}

.hero:after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    border:80px solid rgba(255,255,255,.04);
    left:-180px;
    bottom:-300px;
}

.nav{
    max-width:1250px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:900;
    font-size:22px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    display:grid;
    place-items:center;
    font-size:24px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
}

.admin-link{
    color:white;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.25);
    padding:10px 17px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    font-size:13px;
}

.hero-content{
    max-width:1250px;
    margin:75px auto 0;
    position:relative;
    z-index:2;
}

.badge{
    display:inline-flex;
    padding:8px 15px;
    border-radius:50px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
    font-size:13px;
    margin-bottom:18px;
}

.hero h1{
    margin:0;
    font-size:clamp(34px,6vw,68px);
    line-height:1.15;
    font-weight:900;
    max-width:850px;
}

.hero p{
    color:rgba(255,255,255,.78);
    max-width:700px;
    font-size:17px;
    line-height:2;
    margin:20px 0 28px;
}

.search-box{
    max-width:760px;
    background:white;
    border-radius:22px;
    padding:7px;
    display:flex;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.search-box input{
    border:0;
    outline:0;
    flex:1;
    padding:16px;
    font-size:15px;
    color:#111827;
    background:transparent;
}

.search-box button{
    border:0;
    background:#111827;
    color:white;
    border-radius:16px;
    padding:0 25px;
    font-weight:800;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:45px 20px;
}

.section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:22px;
}

.section-title h2{
    margin:0;
    font-size:26px;
}

.section-title span{
    color:#64748b;
    font-size:13px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:14px;
    margin-bottom:50px;
}

.category{
    border:1px solid #e6eaf0;
    background:white;
    border-radius:22px;
    padding:22px 10px;
    text-align:center;
    transition:.25s;
    color:#1e293b;
}

.category:hover,
.category.active{
    transform:translateY(-5px);
    border-color:#1e3a8a;
    box-shadow:0 15px 35px rgba(30,58,138,.12);
}

.category-icon{
    font-size:34px;
    margin-bottom:9px;
}

.category-name{
    font-size:13px;
    font-weight:800;
}

.listings{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    background:white;
    border:1px solid #e8ecf2;
    border-radius:25px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 5px 20px rgba(15,23,42,.03);
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 20px 45px rgba(15,23,42,.12);
}

.card-image{
    height:240px;
    background:#e8edf4;
    position:relative;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.card:hover .card-image img{
    transform:scale(1.05);
}

.no-image{
    height:100%;
    display:grid;
    place-items:center;
    font-size:60px;
    color:#94a3b8;
}

.card-badge{
    position:absolute;
    top:14px;
    right:14px;
    background:rgba(15,23,42,.78);
    backdrop-filter:blur(8px);
    color:white;
    padding:6px 11px;
    border-radius:50px;
    font-size:11px;
}

.video-badge{
    position:absolute;
    bottom:14px;
    left:14px;
    background:#fff;
    color:#111827;
    padding:6px 10px;
    border-radius:10px;
    font-size:11px;
    font-weight:800;
}

.card-body{
    padding:19px;
}

.card-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:8px;
}

.card-location{
    color:#64748b;
    font-size:13px;
    margin-bottom:13px;
}

.card-price{
    font-size:20px;
    font-weight:900;
    color:#1e3a8a;
}

.view-btn{
    width:100%;
    margin-top:16px;
    border:0;
    border-radius:14px;
    padding:12px;
    background:#eef2ff;
    color:#1e3a8a;
    font-weight:800;
}

.empty{
    text-align:center;
    padding:80px 20px;
    color:#64748b;
}

.empty-icon{
    font-size:60px;
    margin-bottom:15px;
}

.footer{
    background:#111827;
    color:white;
    margin-top:50px;
    padding:40px 20px;
}

.footer-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    gap:30px;
}

.footer p{
    color:#94a3b8;
    font-size:13px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(15,23,42,.78);
    backdrop-filter:blur(8px);
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:min(1000px,100%);
    background:white;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    animation:pop .25s ease;
}

@keyframes pop{
    from{transform:scale(.95);opacity:0}
    to{transform:scale(1);opacity:1}
}

.close{
    position:absolute;
    z-index:5;
    top:14px;
    left:14px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(15,23,42,.75);
    color:white;
    font-size:20px;
}

.gallery-main{
    height:470px;
    background:#111827;
    position:relative;
}

.gallery-main img,
.gallery-main video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.thumbs{
    display:flex;
    gap:8px;
    padding:10px;
    overflow:auto;
    background:#f8fafc;
}

.thumb{
    width:75px;
    height:60px;
    flex:none;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumb.active{
    border-color:#1e3a8a;
}

.modal-info{
    padding:25px;
}

.modal-info h2{
    margin:0 0 8px;
    font-size:28px;
}

.modal-meta{
    color:#64748b;
    font-size:14px;
    margin-bottom:15px;
}

.modal-price{
    color:#1e3a8a;
    font-size:25px;
    font-weight:900;
    margin-bottom:15px;
}

.modal-description{
    line-height:2;
    color:#475569;
    white-space:pre-line;
}

.contact-title{
    margin-top:25px;
    font-size:16px;
    font-weight:900;
}

.contact-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
}

.contact-btn{
    text-decoration:none;
    border:0;
    padding:12px 18px;
    border-radius:14px;
    font-weight:800;
    font-size:13px;
    background:#eef2ff;
    color:#1e3a8a;
}

@media(max-width:900px){
    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .listings{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .hero{
        min-height:520px;
        padding-left:20px;
        padding-right:20px;
    }

    .hero-content{
        margin-top:60px;
    }

    .search-box button{
        padding:0 17px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .listings{
        grid-template-columns:1fr;
    }

    .footer-inner{
        flex-direction:column;
    }

    .gallery-main{
        height:300px;
    }

    .modal-info h2{
        font-size:22px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <nav class="nav">
        <div class="logo">
            <div class="logo-icon">✦</div>
            <span id="siteName">المعرض التفاعلي</span>
        </div>

        <a href="/admin" class="admin-link">
            ⚙️ إدارة المعرض
        </a>
    </nav>

    <div class="hero-content">

        <div class="badge">
            ✦ اكتشف • استعرض • تواصل
        </div>

        <h1>
            اكتشف ما تبحث عنه<br>
            في مكان واحد
        </h1>

        <p id="siteDescription">
            وجهتك لاكتشاف أفضل العروض والمنتجات بطريقة سهلة وتفاعلية.
        </p>

        <div class="search-box">
            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن عقار، سيارة، جوال، أثاث..."
            >

            <button onclick="renderListings()">
                🔍 بحث
            </button>
        </div>

    </div>
</section>

<main class="container">

    <div class="section-title">
        <h2>استكشف الأقسام</h2>
        <span id="countText"></span>
    </div>

    <div id="categories" class="categories"></div>

    <div class="section-title">
        <h2>أحدث المعروضات</h2>
        <span>اكتشف آخر الإضافات</span>
    </div>

    <div id="listings" class="listings"></div>

</main>

<footer class="footer">
    <div class="footer-inner">
        <div>
            <div class="logo">
                <div class="logo-icon">✦</div>
                <span id="footerName">المعرض التفاعلي</span>
            </div>
            <p id="footerDescription"></p>
        </div>

        <div>
            <p>© جميع الحقوق محفوظة</p>
        </div>
    </div>
</footer>

<div id="modal" class="modal" onclick="closeOutside(event)">
    <div class="modal-box">

        <button class="close" onclick="closeModal()">×</button>

        <div id="galleryMain" class="gallery-main"></div>

        <div id="thumbs" class="thumbs"></div>

        <div class="modal-info">

            <h2 id="modalTitle"></h2>

            <div id="modalMeta" class="modal-meta"></div>

            <div id="modalPrice" class="modal-price"></div>

            <div id="modalDescription" class="modal-description"></div>

            <div class="contact-title">
                📞 تواصل مع المدير
            </div>

            <div id="contactButtons" class="contact-buttons"></div>

        </div>

    </div>
</div>

<script>
let appData = {
    settings:{},
    categories:[],
    listings:[]
};

let activeCategory = 'all';

async function loadData(){
    try{
        const res = await fetch('/api/data');
        appData = await res.json();

        document.title =
            appData.settings.name || 'المعرض التفاعلي';

        document.getElementById('siteName').textContent =
            appData.settings.name || 'المعرض التفاعلي';

        document.getElementById('footerName').textContent =
            appData.settings.name || 'المعرض التفاعلي';

        document.getElementById('siteDescription').textContent =
            appData.settings.description || '';

        document.getElementById('footerDescription').textContent =
            appData.settings.description || '';

        renderCategories();
        renderListings();

    }catch(err){
        console.error(err);
    }
}

function renderCategories(){

    const box = document.getElementById('categories');

    box.innerHTML = '';

    const all = document.createElement('button');

    all.className =
        'category ' +
        (activeCategory === 'all' ? 'active' : '');

    all.innerHTML = `
        <div class="category-icon">✨</div>
        <div class="category-name">الكل</div>
    `;

    all.onclick = () => {
        activeCategory = 'all';
        renderCategories();
        renderListings();
    };

    box.appendChild(all);

    appData.categories.forEach(category => {

        const btn = document.createElement('button');

        btn.className =
            'category ' +
            (activeCategory === category.id ? 'active' : '');

        btn.innerHTML = `
            <div class="category-icon">
                ${escapeHtml(category.icon)}
            </div>

            <div class="category-name">
                ${escapeHtml(category.name)}
            </div>
        `;

        btn.onclick = () => {
            activeCategory = category.id;
            renderCategories();
            renderListings();
        };

        box.appendChild(btn);
    });
}

function renderListings(){

    const box = document.getElementById('listings');

    const search =
        document.getElementById('searchInput')
            .value
            .trim()
            .toLowerCase();

    let listings = appData.listings.filter(
        listing => listing.published !== false
    );

    if(activeCategory !== 'all'){
        listings = listings.filter(
            x => x.categoryId === activeCategory
        );
    }

    if(search){
        listings = listings.filter(x => {

            const category =
                getCategory(x.categoryId)?.name || '';

            return (
                x.title +
                ' ' +
                x.description +
                ' ' +
                x.location +
                ' ' +
                category
            ).toLowerCase().includes(search);
        });
    }

    document.getElementById('countText').textContent =
        `${listings.length} إعلان`;

    if(!listings.length){

        box.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div class="empty-icon">🔎</div>
                <h3>لا توجد نتائج</h3>
                <p>جرّب البحث بكلمة أخرى أو اختر قسماً مختلفاً.</p>
            </div>
        `;

        return;
    }

    box.innerHTML = listings.map(listing => {

        const category =
            getCategory(listing.categoryId);

        const image =
            listing.images?.[0];

        return `
            <article class="card">

                <div class="card-image">

                    ${
                        image
                        ? `<img src="${image}" alt="">`
                        : `<div class="no-image">📦</div>`
                    }

                    ${
                        category
                        ? `
                        <div class="card-badge">
                            ${escapeHtml(category.icon)}
                            ${escapeHtml(category.name)}
                        </div>
                        `
                        : ''
                    }

                    ${
                        listing.video
                        ? `<div class="video-badge">▶ فيديو</div>`
                        : ''
                    }

                </div>

                <div class="card-body">

                    <div class="card-title">
                        ${escapeHtml(listing.title)}
                    </div>

                    ${
                        listing.location
                        ? `
                        <div class="card-location">
                            📍 ${escapeHtml(listing.location)}
                        </div>
                        `
                        : ''
                    }

                    ${
                        listing.price
                        ? `
                        <div class="card-price">
                            ${escapeHtml(listing.price)}
                        </div>
                        `
                        : ''
                    }

                    <button
                        class="view-btn"
                        onclick="openListing('${listing.id}')"
                    >
                        عرض التفاصيل ←
                    </button>

                </div>

            </article>
        `;

    }).join('');
}

function openListing(id){

    const listing =
        appData.listings.find(x => x.id === id);

    if(!listing) return;

    document.getElementById('modalTitle').textContent =
        listing.title;

    const category =
        getCategory(listing.categoryId);

    document.getElementById('modalMeta').textContent =
        [
            category
                ? `${category.icon} ${category.name}`
                : '',
            listing.location
                ? `📍 ${listing.location}`
                : ''
        ]
        .filter(Boolean)
        .join('  •  ');

    document.getElementById('modalPrice').textContent =
        listing.price || '';

    document.getElementById('modalDescription').textContent =
        listing.description || 'لا توجد تفاصيل إضافية.';

    renderGallery(listing);

    renderContacts(listing);

    document.getElementById('modal').classList.add('show');

    document.body.style.overflow = 'hidden';
}

function renderGallery(listing){

    const main =
        document.getElementById('galleryMain');

    const thumbs =
        document.getElementById('thumbs');

    const media = [
        ...(listing.images || []).map(url => ({
            type:'image',
            url
        })),
        ...(listing.video
            ? [{
                type:'video',
                url:listing.video
            }]
            : [])
    ];

    if(!media.length){

        main.innerHTML = `
            <div class="no-image">
                📦
            </div>
        `;

        thumbs.innerHTML = '';

        return;
    }

    function showMedia(index){

        const item = media[index];

        if(item.type === 'video'){

            main.innerHTML = `
                <video
                    src="${item.url}"
                    controls
                    playsinline
                ></video>
            `;

        }else{

            main.innerHTML = `
                <img
                    src="${item.url}"
                    alt=""
                >
            `;
        }

        [...thumbs.children].forEach(
            (el,i) => el.classList.toggle(
                'active',
                i === index
            )
        );
    }

    thumbs.innerHTML = media.map(
        (item,index) => {

            if(item.type === 'video'){
                return `
                    <div
                        class="thumb"
                        style="
                            display:grid;
                            place-items:center;
                            background:#111827;
                            color:white;
                            font-size:22px;
                        "
                        onclick="window.galleryShow(${index})"
                    >
                        ▶
                    </div>
                `;
            }

            return `
                <img
                    class="thumb"
                    src="${item.url}"
                    onclick="window.galleryShow(${index})"
                    alt=""
                >
            `;
        }
    ).join('');

    window.galleryShow = showMedia;

    showMedia(0);
}

function renderContacts(){

    const box =
        document.getElementById('contactButtons');

    const settings =
        appData.settings || {};

    const buttons = [];

    if(settings.whatsapp){

        const number =
            settings.whatsapp.replace(/\D/g,'');

        if(number){

            const text =
                encodeURIComponent(
                    'السلام عليكم، أود الاستفسار عن أحد المعروضات في المعرض.'
                );

            buttons.push(`
                <a
                    class="contact-btn"
                    href="https://wa.me/${number}?text=${text}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 واتساب
                </a>
            `);
        }
    }

    if(settings.phone){

        buttons.push(`
            <a
                class="contact-btn"
                href="tel:${escapeAttr(settings.phone)}"
            >
                📞 اتصال
            </a>
        `);
    }

    if(settings.email){

        buttons.push(`
            <a
                class="contact-btn"
                href="mailto:${escapeAttr(settings.email)}"
            >
                ✉️ البريد
            </a>
        `);
    }

    if(settings.website){

        let website =
            settings.website.trim();

        if(!/^https?:\/\//i.test(website)){
            website = 'https://' + website;
        }

        buttons.push(`
            <a
                class="contact-btn"
                href="${escapeAttr(website)}"
                target="_blank"
                rel="noopener"
            >
                🌐 الموقع
            </a>
        `);
    }

    box.innerHTML =
        buttons.length
        ? buttons.join('')
        : `
            <span style="color:#64748b;font-size:13px">
                لم يتم إضافة وسائل التواصل بعد.
            </span>
        `;
}

function closeModal(){

    document.getElementById('modal')
        .classList.remove('show');

    document.body.style.overflow = '';
}

function closeOutside(event){

    if(event.target.id === 'modal'){
        closeModal();
    }
}

function getCategory(id){
    return appData.categories.find(
        x => x.id === id
    );
}

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function escapeAttr(value){
    return escapeHtml(value);
}

document.getElementById('searchInput')
    .addEventListener('input', renderListings);

loadData();
</script>

</body>
</html>
